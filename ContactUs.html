        <title>

        <header>
            <div class="navbar" id="navbar">

        <main> 
        <h1>
            Contact Us for Service or Questions 
        </h1>
        
        <div class="container">
            <form action="ContactUs.php" method="POST">
          
              <label for="fname">First Name</label>
              <input type="text" id="fname" name="firstname" placeholder="Your name.." required>
          
              <label for="lname">Last Name</label>
              <input type="text" id="lname" name="lastname" placeholder="Your last name.." required>
          
              <label for="City">Location (Chicagoland Area)</label>
              <input type="text" id="City" name="cityname" placeholder="City.." required>
          
              <label for="subject">What service are you interested in? Questions?</label required>
              <textarea id="subject" name="subject" placeholder="Please describe the service you need in detail.." style="height:200px"></textarea>
                
              <label for="tel">Phone number: </label>
              <input type="tel" id="phone" name="tel" placeholder="123-456-7890" required>
              <br />
              
              <input type="submit" value="Submit">
          
            </form>
          </div>
        </main>
    </body>
